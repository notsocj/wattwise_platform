# Lint, unit tests, and a dependency audit on every push and pull request, plus
# weekly so newly published advisories are caught (OWASP A03).
name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npx tsc --noEmit -p .
      - run: npm test
